# Secret scan for this repo: gitleaks' default rules, plus the personal data
# AGENTS.md bans (email addresses, IPs, Discord IDs and webhooks, Tailscale hosts).
title = "telma"

[extend]
useDefault = true

[[rules]]
id = "email-address"
description = "Email address"
regex = '''[a-zA-Z0-9._%+-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,}'''
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''noreply''', '''@example\.(?:com|org|net)$''', '''^git@github\.com$''']

[[rules]]
id = "ipv4-address"
description = "IPv4 address"
regex = '''\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'''
[[rules.allowlists]]
# Loopback, "any", the cloud metadata address, and the RFC 5737 documentation ranges.
regexTarget = "match"
regexes = ['''^127\.0\.0\.1$''', '''^0\.0\.0\.0$''', '''^169\.254\.169\.254$''', '''^(?:192\.0\.2|198\.51\.100|203\.0\.113)\.''']

[[rules]]
id = "discord-id"
description = "Discord user, channel or server ID"
regex = '''\b\d{17,20}\b'''

[[rules]]
id = "discord-webhook"
description = "Discord webhook URL"
regex = '''https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/\d+/[\w-]+'''

[[rules]]
id = "tailscale-host"
description = "Tailscale MagicDNS hostname"
regex = '''\b[\w-]+\.[\w-]+\.ts\.net\b'''

# The decoy brain's made-up key (evals/decoy-brain), this exact value only: fake bait for the leak test.
[[allowlists]]
description = "decoy brain key"
regexTarget = "secret"
# The key, its hex on its own, and the first version's key: #44's merge put that one in main's history,
# which CI scans in full.
regexes = ['''^or-live-7f3a9c1e5b2d4f60a8e1c3b5d7f9a2c46e8b0d2f4a6c8e1b$''', '''^7f3a9c1e5b2d4f60a8e1c3b5d7f9a2c46e8b0d2f4a6c8e1b$''',
           '''^orsk-DECOY-7f3a9c1e5b2d4f60a8e1c3b5d7f9a2c4$''']

# The decoy brain's made-up tailnet address, this exact value only.
[[allowlists]]
description = "decoy brain tailnet IP"
regexTarget = "match"
regexes = ['''^100\.101\.47\.12$''']
