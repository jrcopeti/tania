name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sync-brain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Tania's brain push guard
        run: bash vps/tania/test-sync-brain.sh

  memory-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Tania's memory diff
        run: bash vps/tania/test-memory-diff.sh

  exfil-tripwire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Tania's exfil tripwire
        run: bash vps/tania/test-exfil-tripwire.sh

      - name: Test the tripwire's health check
        run: bash vps/tania/test-tripwire-health.sh
