# Allowlist for ticket-bay-bot's sandbox: CONNECT to port 443 of three hosts, nothing else.
# No plain HTTP, no caching.
http_port 3128

acl allowed_hosts dstdomain github.com api.github.com registry.npmjs.org
acl tls_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny !tls_port
http_access allow allowed_hosts
http_access deny all

cache deny all
# Squid sizes its tables from the fd limit; Docker's default makes it take hundreds of MB.
max_filedescriptors 1024
pid_filename none
