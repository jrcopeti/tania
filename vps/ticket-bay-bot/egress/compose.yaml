# Runs as the ticket-bay-bot user, in its rootless Docker. The sandbox joins only `tbb-sandbox`,
# which has no route out; squid sits on both networks and is the only way through.
services:
  squid:
    image: ubuntu/squid:6.13-25.04_beta@sha256:3de2e64f0ca6efdac3e98557607dc0f23050037f3885016d5d5bfcf9950501b8
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      sandbox:
        aliases: [egress]
      outside: {}
    restart: unless-stopped

networks:
  sandbox:
    name: tbb-sandbox
    internal: true
  outside:
    name: tbb-outside
