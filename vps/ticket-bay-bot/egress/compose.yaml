# Runs as the ticket-bay-bot user, in its rootless Docker. The sandbox joins only `tbb-sandbox`,
# which has no route out; squid sits on both networks and is the only way through.
services:
  squid:
    # 26.04 LTS: the _beta tags (25.04 is end of life) stopped getting updates in 2025.
    image: ubuntu/squid:7.2-26.04_edge@sha256:42decc7f79b4e1044f4fe9b3a855af2cbfc76652f3191694726e21058443edc9
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      # Kept across container recreation; squid-denials.sh reads it with docker exec.
      - logs:/var/log/squid
    networks:
      sandbox:
        aliases: [egress]
      outside: {}
    restart: unless-stopped

volumes:
  logs: {}

networks:
  sandbox:
    name: tbb-sandbox
    internal: true
  outside:
    name: tbb-outside
